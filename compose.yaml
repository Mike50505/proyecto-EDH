services:
  db:
    image: postgres:16.15
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:38082:8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
  universo-sync:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "manage.py", "sync_universo", "--watch"]
    depends_on:
      web:
        condition: service_healthy
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    user: "1000:1000"
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - /home/sistemasmr/.cloudflared/338f68d8-8b83-48ea-bb7d-05bba05b5540.json:/etc/cloudflared/credentials.json:ro
volumes:
  postgres_data:
  media_data:
