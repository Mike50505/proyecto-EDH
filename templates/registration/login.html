{% load static %}<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión · EDH</title><script src="{% static 'js/theme.js' %}"></script><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body class="login-page"><button class="theme-toggle login-theme-toggle" type="button" data-theme-toggle aria-label="Activar modo oscuro" aria-pressed="false"><span class="theme-icon" aria-hidden="true">◐</span><span data-theme-label>Modo oscuro</span></button><main class="login-card"><div class="brand-mark large">E</div><p class="eyebrow">EDH · PRODUCCIÓN</p><h1>Rutas de proceso</h1><p class="muted">Accede al catálogo y prepara documentos para fabricación.</p><form method="post" class="stack">{% csrf_token %}{% if form.errors %}<div class="message error">Usuario o contraseña incorrectos.</div>{% endif %}<label>Usuario {{ form.username }}</label><label>Contraseña {{ form.password }}</label><button class="button primary" type="submit">Iniciar sesión</button></form></main></body></html>
