{% if issues %}<section class="card space-top"><div class="section-head"><h2>Incidencias de origen</h2>{% if perms.rutas.view_importissue %}<a href="{% url 'rutas:issues' %}">Ver todas</a>{% endif %}</div><div class="history">{% for issue in issues %}<div><span><strong>{{ issue.kind }}</strong> · {{ issue.detail }}</span><span>{% if issue.resolved %}Resuelta{% else %}Pendiente{% endif %}</span></div>{% endfor %}</div></section>{% endif %}
